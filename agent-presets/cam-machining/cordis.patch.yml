# camind-preset-cam-machining bundle 层：声明「CAM 加工」AgentPreset。
# 0.2.0 起 preset 是 `@deepseek-ai/dsh-agent-preset` 声明行（目录发现器已随上游移除）；
# 条目 config.plugins 即原 agent.cordis.yml 的组合（persona + agent 级固定配置），
# 设计稿 docs/cam-machining-design.md §6.2。展示名/描述即原 preset.yml。
- insert:
    - id: preset-cam-machining
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cam-machining
        name: CAM 加工
        description: CAM 编程交付 Agent：接件审图、动态工艺计划、方案确认、授权编程、问题包与反馈修订，使用 cam-machining skill。
        order: 2
        plugins:
        - id: persona
          name: '@deepseek-ai/dsh-persona'
          # 0.1.3 起上游 persona 配置拆分为 prefix/suffix（旧 text 键不再识别）。
          config:
            prefix: |-
              你是 Camind CAM 加工 Agent，使用 {{model}}，当前工作目录是 {{cwd}}。

              加工任务先加载 cam-machining skill，依其方法接件审图、规划、授权编程、检查交付与反馈修订。
              查询时按问题调用机床/读件/图纸工具，只有编程交付请求才建立执行计划。
              先审图时 goal 保持接件审图范围，按 skill 将问题标记 review/planning/system。
              当前正式任务是输入、要求、工序、来源、授权和修订的事实源；用 cam_task 读取并按 version
              保存草案。todo 是可动态调整的工作进度，不代表生产检查通过。

              在冻结方案和明确参数区间内自主推进；缺关键事实或范围外变更转确认向导与方案审核。
              机床与刀库读取当前档案，图纸要求绑定实体原文，NX 事实绑定源件版本；经验用于参考。
              用当前工作台的选面、标注和工序引用定位问题，在公开回答中说明依据与未决项。

              执行进度来自后台 job 与 runstate，等待 job_output 的真实终态。说明停止 Agent 回复与停止
              后续 NX 提交的区别；超时后先核实远端队列。缺少完整生产证据时整理明确的问题包，
              让系统核验放行条件，签字不替代证据。反馈保留旧包，在同一任务修订后重新核对依赖。
              交付后可提炼人工纠正为记忆候选，由用户审核。

        - id: agent-instructions
          name: '@deepseek-ai/dsh-agent-instructions'
          config:
            maxBytes: 65536

        - id: tool-fs
          name: '@deepseek-ai/dsh-tool-fs'

        - id: tool-fs-search
          name: '@deepseek-ai/dsh-tool-fs-search'
          config:
            sampleOverCapGlobResults: false

        - id: skill-filesystem
          name: '@deepseek-ai/dsh-skill-filesystem'

        - id: tool-skill
          name: '@deepseek-ai/dsh-tool-skill'

        - id: tool-todo
          name: '@deepseek-ai/dsh-tool-todo'
          config:
            allowParallelInProgress: false

        # cam_run 后台长任务的 job 控制器：dsh-web-app 在基础层把 tool-jobs 关掉了，
        # 必须在 agent 组合里补挂，否则 jobs.start() 拒绝（no job controller serves this agent）。
        - id: tool-jobs
          name: '@deepseek-ai/dsh-tool-jobs'

        - id: compaction
          name: cordis:group
          group: true
          isolate:
            compaction: true
            toolResultPruner: true
          config:
            - id: compaction-basic
              name: '@deepseek-ai/dsh-compaction-basic'

            - id: command-compact
              name: '@deepseek-ai/dsh-command-compact'

            - id: tool-result-pruner
              name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
              config:
                thresholdChars: 8192
                headChars: 4096
                tailChars: 1024
