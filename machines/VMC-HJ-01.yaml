# 机床档案种子基线：VMC-HJ-01 华集 CV-850 一号立加
#
# 来源：旧 Camind backend/scripts/seed_cv850.py（设计出处 machining_center_management_design §6）。
# 约定：本文件是仓库内的种子基线（版本化、走评审）；运行时活动档案在 $DSH_HOME/machines/，
# 由 scripts/init.mjs 以「目标不存在才拷」同步，绝不覆盖现场改动。现场改动要升级为基线时，
# 人工拷回本仓库提 PR（见 docs/cam-machining-design.md §5.1）。
#
# 「未就绪」标记原样保留：刀具 measured 全空（上机前人工复核）、后处理器 DRAFT、
# 仿真机床包未就绪——不得当作已验证数据消费。

