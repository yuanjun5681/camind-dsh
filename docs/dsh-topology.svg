<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e6fbe"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="960" height="680" fill="#fafbfc"/>

  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#222">DeepSeek Harness：插件拓扑一图版</text>
  <text x="480" y="56" text-anchor="middle" font-size="12.5" fill="#666">所有插件只跟中间的 ctx 接线板打交道，互相不见面</text>

  <!-- ① 用户 -->
  <rect x="40" y="95" width="170" height="62" rx="10" fill="#eaf2fb" stroke="#2e6fbe" stroke-width="2"/>
  <text x="125" y="120" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d4e89">你（浏览器 Web UI）</text>
  <text x="125" y="141" text-anchor="middle" font-size="11.5" fill="#4a6f9b">发消息 / 看回复和卡片</text>

  <!-- 引擎 -->
  <rect x="390" y="90" width="190" height="72" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
  <text x="485" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#922b21">agent-loop 引擎</text>
  <text x="485" y="135" text-anchor="middle" font-size="11.5" fill="#a5503f">唯一的循环：调模型→调工具→重复</text>
  <text x="485" y="151" text-anchor="middle" font-size="11" fill="#a5503f">（它自己也是一个插件）</text>

  <!-- llm 适配器 -->
  <rect x="740" y="97" width="180" height="58" rx="10" fill="#f0f0f0" stroke="#888" stroke-width="1.8"/>
  <text x="830" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#444">llm-deepseek 适配器插件</text>
  <text x="830" y="140" text-anchor="middle" font-size="11" fill="#666">把请求翻译成 API 调用</text>

  <!-- DeepSeek API 外部 -->
  <rect x="740" y="14" width="180" height="52" rx="26" fill="#fff" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="830" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="#555">☁ DeepSeek API（外部）</text>

  <!-- ctx 接线板 -->
  <rect x="370" y="283" width="220" height="98" rx="12" fill="#2c3e50"/>
  <text x="480" y="310" text-anchor="middle" font-size="15.5" font-weight="700" fill="#fff">Cordis ctx（接线板）</text>
  <text x="480" y="332" text-anchor="middle" font-size="11.5" fill="#cdd6e0">tools · commands · llm · sessions</text>
  <text x="480" y="350" text-anchor="middle" font-size="11.5" fill="#cdd6e0">systemPrompt · subagents · agents</text>
  <text x="480" y="370" text-anchor="middle" font-size="10.5" fill="#8fa3b8">服务按键名挂取 · 事件在此广播</text>

  <!-- 工具类插件（绿：LLM 从菜单里选） -->
  <rect x="30" y="242" width="182" height="66" rx="10" fill="#eafaf1" stroke="#2e8b57" stroke-width="2"/>
  <text x="121" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#1e6b41">tool-upload · tool-memory</text>
  <text x="121" y="286" text-anchor="middle" font-size="11" fill="#3d7a58">上传读取 · 记忆检索工具</text>

  <rect x="30" y="372" width="182" height="66" rx="10" fill="#eafaf1" stroke="#2e8b57" stroke-width="2"/>
  <text x="121" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#1e6b41">page-memory</text>
  <text x="121" y="416" text-anchor="middle" font-size="11" fill="#3d7a58">记忆库管理页</text>

  <rect x="268" y="478" width="204" height="62" rx="10" fill="#eafaf1" stroke="#2e8b57" stroke-width="2"/>
  <text x="370" y="501" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e6b41">subagent · workflow 插件</text>
  <text x="370" y="521" text-anchor="middle" font-size="11" fill="#3d7a58">派生 / 编排子 agent</text>

  <!-- 自动类插件（橙：无人选择，自动工作） -->
  <rect x="508" y="478" width="204" height="62" rx="10" fill="#fdf3e3" stroke="#e08a1e" stroke-width="2"/>
  <text x="610" y="501" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a5f0d">retry · 压缩 · 持久化</text>
  <text x="610" y="521" text-anchor="middle" font-size="11" fill="#8a6a2a">监听事件，自动干活</text>

  <rect x="748" y="300" width="182" height="66" rx="10" fill="#fdf3e3" stroke="#e08a1e" stroke-width="2"/>
  <text x="839" y="324" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a5f0d">persona · skill · 上下文</text>
  <text x="839" y="344" text-anchor="middle" font-size="11" fill="#8a6a2a">每次请求自动注入提示词</text>

  <!-- 结构虚线：插件挂到 ctx -->
  <line x1="370" y1="308" x2="214" y2="282" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <line x1="370" y1="356" x2="214" y2="398" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <line x1="432" y1="381" x2="392" y2="476" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <line x1="536" y1="381" x2="586" y2="476" stroke="#e08a1e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <line x1="592" y1="332" x2="746" y2="332" stroke="#e08a1e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aGray)"/>

  <!-- 运行时流程（实线编号） -->
  <!-- ① 你 → 引擎 -->
  <line x1="212" y1="126" x2="386" y2="126" stroke="#2e6fbe" stroke-width="2.6" marker-end="url(#aBlue)"/>
  <text x="299" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e6fbe" paint-order="stroke" stroke="#fafbfc" stroke-width="4">① 你发消息</text>

  <!-- ② 引擎 → llm 适配器 -->
  <line x1="582" y1="126" x2="736" y2="126" stroke="#c0392b" stroke-width="2.6" marker-end="url(#aRed)"/>
  <text x="659" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fafbfc" stroke-width="4">② 引擎问模型</text>

  <!-- llm 适配器 → DeepSeek API -->
  <line x1="830" y1="95" x2="830" y2="70" stroke="#888" stroke-width="2" marker-end="url(#aGray)"/>
  <text x="846" y="86" text-anchor="start" font-size="11" fill="#777">HTTPS</text>

  <!-- ③ 引擎 → ctx -->
  <line x1="472" y1="164" x2="472" y2="279" stroke="#c0392b" stroke-width="2.6" marker-end="url(#aRed)"/>
  <text x="352" y="212" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fafbfc" stroke-width="4">③ 模型点名工具 →</text>
  <text x="352" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fafbfc" stroke-width="4">引擎经 ctx.tools 执行</text>

  <!-- ④ 结果回喂（弯道） -->
  <path d="M 592 352 C 680 350 660 180 584 164" fill="none" stroke="#c0392b" stroke-width="2.6" marker-end="url(#aRed)"/>
  <text x="700" y="236" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fafbfc" stroke-width="4">④ 工具结果回写历史</text>
  <text x="700" y="254" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fafbfc" stroke-width="4">带着它回到 ② 再问</text>

  <!-- ⑤ 事件广播 -->
  <text x="640" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e" paint-order="stroke" stroke="#fafbfc" stroke-width="4">⑤ 全程事件广播</text>
  <text x="700" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e" paint-order="stroke" stroke="#fafbfc" stroke-width="4">⑤ 自动注入</text>

  <!-- 图例 -->
  <rect x="30" y="580" width="900" height="66" rx="8" fill="#fff" stroke="#ddd"/>
  <rect x="48" y="596" width="14" height="14" fill="#eaf2fb" stroke="#2e6fbe" stroke-width="1.6"/>
  <text x="68" y="608" font-size="12" fill="#333">人触发</text>
  <rect x="138" y="596" width="14" height="14" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
  <text x="158" y="608" font-size="12" fill="#333">引擎循环</text>
  <rect x="248" y="596" width="14" height="14" fill="#eafaf1" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="268" y="608" font-size="12" fill="#333">LLM 从工具菜单里选</text>
  <rect x="428" y="596" width="14" height="14" fill="#fdf3e3" stroke="#e08a1e" stroke-width="1.6"/>
  <text x="448" y="608" font-size="12" fill="#333">自动/事件驱动</text>
  <line x1="566" y1="603" x2="596" y2="603" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="604" y="608" font-size="12" fill="#333">虚线＝挂到 ctx 注册/取服务</text>
  <text x="480" y="634" text-anchor="middle" font-size="12" fill="#666">循环出口：模型不再调工具 → 本圈结束（工具结果只追加进历史，不重写，KV cache 友好）</text>
</svg>
